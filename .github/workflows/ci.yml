name: CI

on:
  push:
    branches: [main, HS-dev]
  pull_request:
    branches: [main, HS-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Intel oneAPI Fortran (ifx)
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran

      - name: Install fpm
        run: |
          curl -L -o fpm https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x fpm
          sudo mv fpm /usr/local/bin/fpm

      - name: fpm build (resolves KSROP as a real git dependency)
        run: |
          source /opt/intel/oneapi/setvars.sh
          fpm build --compiler ifx --flag "-heap-arrays"

      - name: fpm test
        run: |
          source /opt/intel/oneapi/setvars.sh
          ulimit -s unlimited
          fpm test --compiler ifx --flag "-heap-arrays"
