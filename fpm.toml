name = "orem"
version = "0.1.0"
license = "license"
author = "Harishkumar Sellamuthu"
description = "Re-entry prediction: RSM/GA fitting over KS-regularized propagation"

[library]
source-dir = "src"

[fortran]
source-form = "fixed"
implicit-typing = true
implicit-external = true

[[executable]]
name = "orem"
source-dir = "app"
main = "main_orem.F"

